                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">期日</label>
                    <input type="date" id="edit-task-date"

                    <select id="edit-task-status"
                        class="w-full border rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-sky-500">
                        <option value="pending">未完了</option>
                        <option value="completed">完了</option>

                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button onclick="closeModal()"
                        class="px-4 py-2 text-sm font-bold text-gray-500 hover:bg-gray-100 rounded-full">キャンセル</button>

    <script>
        // LocalStorage Keys (設定用)
        const SETTINGS_KEY = 'app_user_settings';
        // const API_URL = 'http://localhost:8000/manage_todo.php';
        const API_URL = 'manage_todo.php';

        // State Variables
        let todos = [];
        let currentLoginUser = 'guest_user';
        let settings = JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {
            theme: 'light',
            fontSize: 'text-base',
            defaultTab: 'todo'
        };

        let dataTableInstance = null;
        let calendarInstance = null;

        // 初期化処理
        $(document).ready(function () {
            applySettings();
            initFullCalendar();
            initDataTable();

            // サーバーからデータを取得してから画面描画
            fetchTodos().then(() => {
                switchTab(settings.defaultTab);
            });
        });

        // --- API通信 (バックエンド連携) ---
        async function fetchTodos() {
            try {
                const response = await fetch(API_URL, { method: 'GET', credentials: 'include' });
                const data = await response.json();

                if (data.current_user) {
                    currentLoginUser = data.current_user;
                    // ユーザー名を表示してhiddenを外す
                    $('#header-user-badge').text(currentLoginUser).removeClass('hidden');
                }
                const itemList = Array.isArray(data) ? data : (data.todos || []);

                todos = itemList.map(item => ({
                    id: item.id,
                    title: item.content,
                    date: item.due_date ? item.due_date.split(' ')[0] : '',
                    status: item.is_completed == 1 ? 'completed' : 'pending',
                    category: item.category || 'guest'
                }));
                renderAll();
            } catch (e) {
                console.error('データの取得に失敗しました', e);
            }
        }

        async function saveTaskToServer(task) {
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id: task.id,
                        content: task.title,
                        category: task.category || 'guest',
                        is_completed: task.status === 'completed' ? 1 : 0,
                        due_date: task.date
                    })
                });
                await fetchTodos();
            } catch (e) {
                console.error('データの保存に失敗しました', e);
            }
        }

        async function deleteTaskFromServer(id) {
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'delete',
                        id: id
                    })
                });
                await fetchTodos();
            } catch (e) {
                console.error('データの削除に失敗しました', e);
            }
        }

        // --- URL連携・共有機能 ---
        async function copyShareUrl() {
            for (let todo of todos) {
                if (!todo.category || todo.category === 'guest') {
                    todo.category = currentLoginUser;
                    await saveTaskToServer(todo);
                }
            }

            const targetUrl = window.location.href;
            try {
                await navigator.clipboard.writeText(targetUrl);
                showToast();
            } catch (err) {
                console.error('クリップボードのコピーに失敗しました', err);
                alert('クリップボードへのコピーに失敗しました。');
            }
        }

        function showToast() {
            const $toast = $('#toast');
            $toast.removeClass('opacity-0 pointer-events-none').addClass('opacity-100');
            setTimeout(() => {
                $toast.removeClass('opacity-100').addClass('opacity-0 pointer-events-none');
            }, 2500);
        }

        function renderAll() {
            renderTodoList();
            updateCalendarEvents();
            updateDataTable();
        }

        function switchTab(tabId) {
            $('.tab-content').addClass('hidden');
            $(`#tab-${tabId}`).removeClass('hidden');

            $('.nav-item').removeClass('font-bold text-sky-500').addClass('font-medium text-gray-700');
            $(`#nav-${tabId}`).addClass('font-bold text-sky-500').removeClass('font-medium text-gray-700');

            const titles = {
                todo: 'TODO',
                calendar: 'カレンダー',
                table: 'データ一覧',
                settings: '設定'
            };
            $('#page-title').text(titles[tabId]);

            if (tabId === 'calendar' && calendarInstance) {
                calendarInstance.render();
            }
        }

        // --- TODO機能 ---
        function renderTodoList() {
            const $list = $('#todo-list').empty();
            if (todos.length === 0) {
                $list.html('<p class="text-center text-gray-400 py-8">タスクはありません</p>');
                return;
            }
            todos.forEach(todo => {
                const isDone = todo.status === 'completed';
                const isPrivate = !todo.category || todo.category === 'guest';
                $list.append(`
                    <div class="flex items-center justify-between p-3 hover:bg-gray-50 transition rounded-xl">
                        <div class="flex items-center gap-3">
                          <input type="checkbox" ${isDone ? 'checked' : ''} onchange="toggleStatus('${todo.id}')" 
                                                    class="w-5 h-5 accent-sky-500 rounded cursor-pointer">
                          <span class="${isDone ? 'line-through text-gray-400' : 'text-gray-800'} font-medium">${escapeHtml(todo.title)}</span>
                        
                        </div>
                        <div class="flex items-center gap-3 text-sm text-gray-400">
                          <span>${todo.date || '期限なし'}</span>
                          <button onclick="openModal('${todo.id}')" class="hover:text-sky-500 px-1"><i class="fa-regular fa-pen-to-square"></i></button>
                          <button onclick="deleteTask('${todo.id}')" class="hover:text-red-500 px-1"><i class="fa-regular fa-trash-can"></i></button>
                        </div>
                    </div>
                `);
            });
        }

        async function quickAddTodo() {
            const title = $('#quick-title').val().trim();
            const date = $('#quick-date').val();
            if (!title) return;

            const newTask = {
                id: 'todo-' + Date.now(),
                title: title,
                date: date || new Date().toISOString().split('T')[0],
                status: 'pending',
                category: 'guest'
            };
            $('#quick-title').val('');
            $('#quick-date').val('');
            await saveTaskToServer(newTask);
        }

        async function toggleStatus(id) {
            const item = todos.find(t => t.id === id);
            if (item) {
                item.status = item.status === 'completed' ? 'pending' : 'completed';
                await saveTaskToServer(item);
            }
        }

        async function deleteTask(id) {
            if (confirm('このタスクを削除しますか？')) {
                await deleteTaskFromServer(id);
            }
        }

        // --- Modal 操作 ---
        function openModal(id = null) {
            if (id) {
                const item = todos.find(t => t.id === id);
                $('#modal-title').text('タスクの編集');
                $('#edit-id').val(item.id);
                $('#edit-task-title').val(item.title);
                $('#edit-task-date').val(item.date);
                $('#edit-task-status').val(item.status);
            } else {
                $('#modal-title').text('タスクの追加');
                $('#edit-id').val('');
                $('#edit-task-title').val('');
                $('#edit-task-date').val(new Date().toISOString().split('T')[0]);
                $('#edit-task-status').val('pending');
            }
            $('#modal').removeClass('hidden');
        }

        function closeModal() {
            $('#modal').addClass('hidden');
        }

        async function saveTask() {
            const id = $('#edit-id').val();
            const title = $('#edit-task-title').val().trim();
            const date = $('#edit-task-date').val();
            const status = $('#edit-task-status').val();

            if (!title) return;

            const existingItem = todos.find(t => t.id === id);
            const category = existingItem ? existingItem.category : 'guest';

            const taskData = {
                id: id || ('todo-' + Date.now()),
                title,
                date,
                status,
                category: category || 'guest'
            };

            closeModal();
            await saveTaskToServer(taskData);
        }

        // --- DataTables / FullCalendar / Export ---
        function initDataTable() {
            dataTableInstance = $('#datatable').DataTable({
                language: { url: 'https://cdn.datatables.net/plug-ins/1.13.6/i18n/ja.json' },
                columns: [
                    { data: 'title' },
                    { data: 'date' },
                    {
                        data: 'category',
                        render: data => (!data || data === 'guest')
                            ? '<span class="px-2 py-1 bg-amber-100 text-amber-700 text-xs font-bold rounded-full">非公開 (guest)</span>'
                            : '<span class="px-2 py-1 bg-blue-100 text-blue-700 text-xs font-bold rounded-full">公開</span>'
                    },
                    {
                        data: 'status',
                        render: data => data === 'completed'
                            ? '<span class="px-2 py-1 bg-green-100 text-green-700 text-xs font-bold rounded-full">完了</span>'
                            : '<span class="px-2 py-1 bg-yellow-100 text-yellow-700 text-xs font-bold rounded-full">未完了</span>'
                    },
                    {
                        data: 'id',
                        render: id => `<button onclick="openModal('${id}')" class="text-sky-500 hover:underline mr-2">編集</button><button onclick="deleteTask('${id}')" class="text-red-500 hover:underline">削除</button>`
                    }
                ]
            });
        }

        function updateDataTable() {
            if (!dataTableInstance) return;
            dataTableInstance.clear().rows.add(todos).draw();
        }

        // function initFullCalendar() {
        //     const calendarEl = document.getElementById('calendar');
        //     calendarInstance = new FullCalendar.Calendar(calendarEl, {
        //         initialView: 'dayGridMonth',
        //         locale: 'ja',
        //         headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek' },
        //         editable: true,
        //         eventDrop: async function (info) {
        //             const item = todos.find(t => t.id === info.event.id);
        //             if (item) {
        //                 item.date = info.event.startStr;
        //                 await saveTaskToServer(item);
        //             }
        //         },
        //         eventClick: function (info) { openModal(info.event.id); }
        //     });
        //     calendarInstance.render();
        // }
        function initFullCalendar() {
            // メインカレンダー
            const calendarEl = document.getElementById('calendar');
            if (calendarEl) {
                calendarInstance = new FullCalendar.Calendar(calendarEl, {
                    initialView: 'dayGridMonth',
                    locale: 'ja',
                    headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek' },
                    editable: true,
                    eventDrop: async function (info) {
                        const item = todos.find(t => t.id === info.event.id);
                        if (item) {
                            item.date = info.event.startStr;
                            await saveTaskToServer(item);
                        }
                    },
                    eventClick: function (info) { openModal(info.event.id); }
                });
                calendarInstance.render();
            }

            // TODO下部用（モバイル向けなど）カレンダー
            const calendarMobileEl = document.getElementById('calendar-mobile');
            if (calendarMobileEl) {
                calendarMobileInstance = new FullCalendar.Calendar(calendarMobileEl, {
                    initialView: 'dayGridMonth',
                    locale: 'ja',
                    height: 'auto', // ★ 高さを自動調整（または固定値 350 など）にする
                    headerToolbar: { left: 'prev,next', center: 'title', right: 'today' },
                    editable: true,
                    eventDrop: async function (info) {
                        const item = todos.find(t => t.id === info.event.id);
                        if (item) {
                            item.date = info.event.startStr;
                            await saveTaskToServer(item);
                        }
                    },
                    eventClick: function (info) { openModal(info.event.id); }
                });
                calendarMobileInstance.render();
                
                // ★ タブ切り替え時や画面幅変更時にサイズを再計算させる場合
                setTimeout(() => {
                    calendarMobileInstance.updateSize();
                }, 100);
            }
        }

        // function updateCalendarEvents() {
        //     if (!calendarInstance) return;
        //     calendarInstance.removeAllEvents();
        //     const events = todos.map(t => ({
        //         id: t.id,
        //         title: t.title,
        //         start: t.date,
        //         backgroundColor: t.status === 'completed' ? '#10b981' : '#1d9bf0',
        //         borderColor: 'transparent'
        //     }));
        //     calendarInstance.addEventSource(events);
        // }
        function updateCalendarEvents() {
            const events = todos.map(t => ({
                id: t.id,
                title: t.title,
                start: t.date,
                backgroundColor: t.status === 'completed' ? '#10b981' : '#1d9bf0',
                borderColor: 'transparent'
            }));

            // メインカレンダーの更新
            if (calendarInstance) {
                calendarInstance.removeAllEvents();
                calendarInstance.addEventSource(events);
            }
            
            // モバイル用カレンダーのイベントも完全に再設定して更新
            if (calendarMobileInstance) {
                calendarMobileInstance.removeAllEvents();
                calendarMobileInstance.addEventSource(events);
                calendarMobileInstance.render(); // 再描画を確実にする
            }
        }

        function exportImage() {
            const target = document.getElementById('capture-area');
            html2canvas(target, { scale: 2, useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = `workspace_${new Date().toISOString().split('T')[0]}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        function exportCSV() {
            let csvContent = "\uFEFFタイトル,期日,公開状態,ステータス\n";
            todos.forEach(t => {
                const isPrivate = !t.category || t.category === 'guest';
                csvContent += `"${t.title}","${t.date}","${isPrivate ? '非公開' : '公開'}","${t.status === 'completed' ? '完了' : '未完了'}"\n`;
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `tasks_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }

        function exportExcel() {
            const data = todos.map(t => ({
                'タイトル': t.title,
                '期日': t.date,
                '公開状態': (!t.category || t.category === 'guest') ? '非公開' : '公開',
                'ステータス': t.status === 'completed' ? '完了' : '未完了'
            }));
            const worksheet = XLSX.utils.json_to_sheet(data);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Tasks");
            XLSX.writeFile(workbook, `tasks_${new Date().toISOString().split('T')[0]}.xlsx`);
        }

        function saveSettings() {
            settings = {
                theme: $('#setting-theme').val(),
                fontSize: $('#setting-fontsize').val(),
                defaultTab: $('#setting-defaulttab').val()
            };
            localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
            applySettings();
        }

        function applySettings() {
            $('#setting-theme').val(settings.theme);
            $('#setting-fontsize').val(settings.fontSize);
            $('#setting-defaulttab').val(settings.defaultTab);
            $('body').removeClass('text-sm text-base text-lg').addClass(settings.fontSize);
            if (settings.theme === 'dark') {
                $('body').addClass('bg-gray-900 text-white').removeClass('bg-white text-gray-900');
            } else {
                $('body').addClass('bg-white text-gray-900').removeClass('bg-gray-900 text-white');
            }
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    </script>
